<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b303b"/>
      <stop offset="1" stop-color="#1b1e25"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b880"/>
      <stop offset="1" stop-color="#e0703a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- gauge: 240 degree track, centre (128,124), radius 72 -->
  <path d="M 65.6 160 A 72 72 0 1 1 190.4 160" fill="none" stroke="#3b414e" stroke-width="22" stroke-linecap="round"/>
  <!-- fill to about 65 % of the track -->
  <path d="M 65.6 160 A 72 72 0 0 1 166.9 63.4" fill="none" stroke="url(#fill)" stroke-width="22" stroke-linecap="round"/>
  <!-- needle -->
  <line x1="128" y1="124" x2="157" y2="80" stroke="#f4f1ea" stroke-width="9" stroke-linecap="round"/>
  <circle cx="128" cy="124" r="13" fill="#f4f1ea"/>
  <!-- two limit bars: 5 h and 7 days -->
  <rect x="70" y="186" width="116" height="12" rx="6" fill="#3b414e"/>
  <rect x="70" y="186" width="30" height="12" rx="6" fill="#8fbf8a"/>
  <rect x="70" y="208" width="116" height="12" rx="6" fill="#3b414e"/>
  <rect x="70" y="208" width="82" height="12" rx="6" fill="#e3b75b"/>
</svg>
